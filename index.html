<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FXIDN Platform</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#070b12;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    padding:20px;
    border-bottom:1px solid #202a38;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#16d99a;
}

main{
    max-width:1400px;
    margin:auto;
    padding:25px;
}

.subtitle{
    color:#77859a;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:25px;
}

.card{
    background:#0d141f;
    border:1px solid #1d2938;
    border-radius:14px;
    padding:20px;
}

.symbol{
    color:#8190a4;
    font-size:13px;
    margin-bottom:12px;
}

.quote{
    min-height:100px;
}

.analysis{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
    margin-top:20px;
}

.chart{
    height:500px;
}

.live{
    color:#16d99a;
    font-size:28px;
    font-weight:bold;
    margin:20px 0;
}

.info{
    color:#9aa7b9;
    line-height:1.7;
}

@media(max-width:800px){
    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .analysis{
        grid-template-columns:1fr;
    }
}

@media(max-width:500px){
    .grid{
        grid-template-columns:1fr;
    }

    main{
        padding:15px;
    }

    .chart{
        height:400px;
    }
}
</style>
</head>

<body>

<header>
<div class="logo">
FX<span>IDN</span>-Platform
</div>
</header>

<main>

<h1>Market Dashboard</h1>

<p class="subtitle">
Live Forex & Gold Market
</p>

<div class="grid">

<div class="card">
<div class="symbol">XAU/USD</div>

<div class="quote">
<div class="tradingview-widget-container">
<div class="tradingview-widget-container__widget"></div>

<script type="text/javascript"
src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js"
async>

{
"symbol":"OANDA:XAUUSD",
"width":"100%",
"isTransparent":true,
"colorTheme":"dark",
"locale":"en"
}

</script>
</div>
</div>

</div>


<div class="card">
<div class="symbol">EUR/USD</div>

<div class="quote">
<div class="tradingview-widget-container">
<div class="tradingview-widget-container__widget"></div>

<script type="text/javascript"
src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js"
async>

{
"symbol":"FX:EURUSD",
"width":"100%",
"isTransparent":true,
"colorTheme":"dark",
"locale":"en"
}

</script>
</div>
</div>

</div>


<div class="card">
<div class="symbol">GBP/USD</div>

<div class="quote">
<div class="tradingview-widget-container">
<div class="tradingview-widget-container__widget"></div>

<script type="text/javascript"
src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js"
async>

{
"symbol":"FX:GBPUSD",
"width":"100%",
"isTransparent":true,
"colorTheme":"dark",
"locale":"en"
}

</script>
</div>
</div>

</div>


<div class="card">
<div class="symbol">USD/JPY</div>

<div class="quote">
<div class="tradingview-widget-container">
<div class="tradingview-widget-container__widget"></div>

<script type="text/javascript"
src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js"
async>

{
"symbol":"FX:USDJPY",
"width":"100%",
"isTransparent":true,
"colorTheme":"dark",
"locale":"en"
}

</script>
</div>
</div>

</div>

</div>


<div class="analysis">

<div class="card">

<div class="symbol">
EUR/USD LIVE CHART
</div>

<div class="chart">

<div class="tradingview-widget-container"
style="height:100%;width:100%">

<div class="tradingview-widget-container__widget"
style="height:100%;width:100%">
</div>

<script type="text/javascript"
src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
async>

{
"autosize":true,
"symbol":"FX:EURUSD",
"interval":"15",
"timezone":"Asia/Jakarta",
"theme":"dark",
"style":"1",
"locale":"en",
"allow_symbol_change":true,
"calendar":false,
"support_host":"https://www.tradingview.com"
}

</script>

</div>

</div>

</div>


<div class="card">

<div class="symbol">
FXIDN MARKET STATUS
</div>

<div class="live">
● LIVE
</div>

<p class="info">
Market data dan chart ditampilkan secara langsung
melalui widget market.
</p>

<hr style="border-color:#202a38">

<h3>MARKETS</h3>

<p class="info">
XAU/USD<br>
EUR/USD<br>
GBP/USD<br>
USD/JPY
</p>

</div>

</div>

</main>

</body>
</html>
